<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · DevBridge</title><link rel="stylesheet" href="../../../comum/frontend/app.css"></head>
<body>
<header class="auth-head"><a class="brand" href="index.html">Dev<span>Bridge</span></a><span class="grow"></span><nav class="top-links"><a href="cadastro.html">Criar conta</a></nav></header>
<main class="auth-wrap" style="max-width:520px"><section class="auth-card"><span class="chip">ACESSO SEGURO</span><h1>Bem-vindo de volta</h1><p class="muted">Após entrar, será direcionado automaticamente para a sua área.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Palavra-passe<input name="senha" type="password" autocomplete="current-password" required></label><button>Entrar</button><p id="error" class="error"></p></form></section></main>
<script src="../../../comum/frontend/app.js"></script><script>
document.querySelector('#loginForm').addEventListener('submit', async function(event) {
 event.preventDefault(); const error = document.querySelector('#error'); error.textContent = '';
 try { const result = await DevBridge.api('login', {method:'POST', body:Object.fromEntries(new FormData(event.target))}); window.location.assign(new URL(result.destino, new URL('../../../', document.baseURI)).href); } catch (e) { error.textContent = e.message; }
});
</script></body></html>
