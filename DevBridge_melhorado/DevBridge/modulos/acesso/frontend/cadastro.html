<!doctype html>
<html lang="pt">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · DevBridge</title><link rel="stylesheet" href="../../../comum/frontend/app.css"></head>
<body>
<header class="auth-head"><a class="brand" href="index.html">Dev<span>Bridge</span></a><span class="grow"></span><nav class="top-links"><a href="login.html">Entrar</a></nav></header>
<main class="auth-wrap" style="max-width:590px"><section class="auth-card"><span class="chip">NOVA CONTA</span><h1>Crie o seu espaço no DevBridge</h1><p class="muted">Selecione o perfil que melhor representa a sua participação na plataforma.</p><form id="registerForm"><label>Nome completo<input name="nome" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Palavra-passe<input name="senha" type="password" minlength="8" autocomplete="new-password" required><span class="form-help">Use pelo menos 8 caracteres.</span></label><label>Tipo de utilizador<select name="tipo" required><option value="">Selecione o tipo</option><option value="CLIENTE">Cliente</option><option value="PROGRAMADOR">Programador</option><option value="TECNICO_REDES">Técnico de Redes</option></select></label><button>Criar conta</button><p id="error" class="error"></p></form></section></main>
<script src="../../../comum/frontend/app.js"></script><script>
document.querySelector('#registerForm').addEventListener('submit', async function(event) {
 event.preventDefault(); const error = document.querySelector('#error'); error.textContent = '';
 try { await DevBridge.api('registo', {method:'POST', body:Object.fromEntries(new FormData(event.target))}); window.location.assign('login.html'); } catch (e) { error.textContent = e.message; }
});
</script></body></html>
